services:
  postgres:
    image: postgres:16
    container_name: axisclip_postgres
    restart: always
    environment:
      POSTGRES_DB: axisclip
      POSTGRES_USER: axisclip
      POSTGRES_PASSWORD: axisclip
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axisclip -d axisclip"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: axisclip_redis
    restart: always
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: axis_clip_backend
    env_file:
      - .env
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./storage:/storage

  worker:
    build: ./backend
    container_name: axisclip_worker
    env_file:
      - .env
    command: rq worker videos --url redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./storage:/storage

  publisher:
    build: ./backend
    container_name: axisclip_publisher
    env_file:
      - .env
    command: python -m app.workers.publisher_worker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./storage:/storage

  frontend:
    build: ./frontend
    container_name: axisclip_frontend
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules

volumes:
  postgres-data:
  node_modules:
